<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الرياضيات - الصف السادس الابتدائي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
        }

        .btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        /* Game Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .stat-box {
            background: var(--light);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
            border: 2px solid #e9ecef;
        }

        #timer {
            color: var(--danger);
        }

        /* Question Area */
        .question-text {
            font-size: 1.8rem;
            color: var(--dark);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            font-size: 1.3rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .option-btn:hover {
            background: var(--primary);
            color: white;
        }

        .option-btn.correct {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .option-btn.wrong {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        /* Results Screen */
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--success);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 0 auto 20px;
            border: 8px solid #c2f0fc;
        }

        .feedback-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--dark);
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .game-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen" class="container">
        <h1>لعبة الرياضيات التفاعلية</h1>
        <div class="subtitle">الوحدة الأولى - الصف السادس الابتدائي</div>
        <div style="margin-bottom: 30px; color: #555;">
            إعداد: مستر هاني شكري حجازي<br>
            الوقت المتاح: 20 دقيقة | عدد الأسئلة: 20
        </div>
        <button class="btn" onclick="startGame()">ابدأ الامتحان الآن</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="container hidden">
        <div class="game-header">
            <div class="stat-box">السؤال: <span id="q-counter">1</span> / 20</div>
            <div class="stat-box">النقاط: <span id="score-display">0</span></div>
            <div class="stat-box">الوقت: <span id="timer">20:00</span></div>
        </div>
        
        <div class="question-text" id="question-text">
            جاري تحميل السؤال...
        </div>
        
        <div class="options-grid" id="options-container">
            <!-- Options will be generated via JS -->
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="container hidden">
        <h1>انتهى الامتحان!</h1>
        <div class="score-circle" id="final-score">0%</div>
        <div class="feedback-text" id="feedback-msg">ممتاز!</div>
        <button class="btn" onclick="location.reload()">العب مرة أخرى</button>
    </div>

    <script>
        const questions = [
            { q: "العدد ....... يقبل القسمة على 5", options: ["652", "357", "573", "735"], answer: 3 },
            { q: "العدد ....... يقبل القسمة على 2 ، 3 ، 5 معاً", options: ["12", "21", "10", "30"], answer: 3 },
            { q: "(م.م.أ) لمقامي الكسرين 1/4 و 3/12 هو", options: ["6", "8", "12", "16"], answer: 2 },
            { q: "أي من الأعداد يقبل القسمة على 2 ، 3 ، 5 معاً؟", options: ["200", "300", "400", "500"], answer: 1 },
            { q: "العدد الذي عوامله الأولية 2 ، 2 ، 5 هو", options: ["11", "10", "20", "25"], answer: 2 },
            { q: "(م.م.أ) لعددين أوليين فيما بينهما هو", options: ["1", "0", "حاصل جمعهما", "حاصل ضربهما"], answer: 3 },
            { q: "27 + 36 = 9 × ( 3 + ....... )", options: ["4", "5", "2", "18"], answer: 0 },
            { q: "ناتج طرح: 3/4 - 7/24 =", options: ["11/24", "2/4", "4/24", "4/4"], answer: 0 },
            { q: "عددان أوليان فيما بينهما هما:", options: ["6 و 8", "4 و 9", "10 و 15", "2 و 8"], answer: 1 },
            { q: "أصغر مقام مشترك للكسرين 1/3 و 2/5 هو:", options: ["4", "5", "15", "20"], answer: 2 },
            { q: "جميع الأعداد تقبل القسمة على العدد:", options: ["0", "1", "2", "5"], answer: 1 },
            { q: "العدد الذي عوامله الأولية 2 ، 5 ، 7 هو", options: ["14", "50", "60", "70"], answer: 3 },
            { q: "(م.م.أ) للعددين 6 ، 8 هو", options: ["24", "54", "42", "48"], answer: 0 },
            { q: "12 + ....... = 6 × ( 2 + 7 )", options: ["24", "42", "48", "54"], answer: 1 },
            { q: "من عوامل العدد 5، العدد:", options: ["5", "8", "12", "52"], answer: 0 },
            { q: "ناتج طرح: 6/10 - 1/2 =", options: ["1/10", "1/4", "5/8", "1/2"], answer: 0 },
            { q: "العدد 333 يقبل القسمة على:", options: ["4", "3", "6", "7"], answer: 1 },
            { q: "(ع.م.أ) للعددين 15 و 25 هو", options: ["3", "5", "7", "35"], answer: 1 },
            { q: "جميع الأعداد الفردية لا تقبل القسمة على:", options: ["1", "2", "3", "5"], answer: 1 },
            { q: "(ع.م.أ) للعددين 12 و 20 هو:", options: ["3", "4", "5", "6"], answer: 1 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 20 * 60; // 20 minutes in seconds
        let timerInterval;
        let canAnswer = true;

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                
                if (seconds < 10) seconds = "0" + seconds;
                if (minutes < 10) minutes = "0" + minutes;
                
                document.getElementById('timer').innerText = `${minutes}:${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function loadQuestion() {
            canAnswer = true;
            let q = questions[currentQuestion];
            document.getElementById('q-counter').innerText = currentQuestion + 1;
            document.getElementById('question-text').innerText = q.q;
            
            let optionsHtml = '';
            for(let i=0; i < q.options.length; i++) {
                optionsHtml += `<button class="option-btn" onclick="checkAnswer(${i}, this)">${q.options[i]}</button>`;
            }
            document.getElementById('options-container').innerHTML = optionsHtml;
        }

        function checkAnswer(selectedIndex, buttonElement) {
            if (!canAnswer) return;
            canAnswer = false;
            
            let correctIndex = questions[currentQuestion].answer;
            let buttons = document.querySelectorAll('.option-btn');
            
            if (selectedIndex === correctIndex) {
                buttonElement.classList.add('correct');
                score++;
                document.getElementById('score-display').innerText = score;
            } else {
                buttonElement.classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            }
            
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 1500);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            
            let percentage = Math.round((score / questions.length) * 100);
            document.getElementById('final-score').innerText = `${percentage}%`;
            
            let msg = "";
            if (percentage >= 90) msg = "أداء استثنائي! أنت بطل في الرياضيات.";
            else if (percentage >= 75) msg = "رائع جداً! مستوى مميز.";
            else if (percentage >= 50) msg = "جيد، ولكن يمكنك تحقيق الأفضل بالتدريب.";
            else msg = "تحتاج إلى مراجعة الوحدة والمحاولة مرة أخرى.";
            
            document.getElementById('feedback-msg').innerText = msg;
        }
    </script>
</body>
</html>
